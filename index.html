<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090b0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>RádioPro Brasil • Central de Rádios & Som Ambiente</title>
    <style>
        :root {
            --bg-base: #090b0f;
            --bg-surface: #11151d;
            --bg-elevated: #171d28;
            --bg-hover: #1e2636;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text-main: #f3f6fa;
            --text-muted: #8b97ab;
            --emerald: #10b981;
            --emerald-dim: rgba(16, 185, 129, 0.15);
            --amber: #f59e0b;
            --amber-dim: rgba(245, 158, 11, 0.15);
            --rose: #f43f5e;
            --radius: 12px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            overflow-x: clip;
            background: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100dvh;
            scrollbar-color: rgba(16, 185, 129, 0.45) var(--bg-base);
        }
        ::selection {
            background: rgba(16, 185, 129, 0.35);
            color: #fff;
        }
        :focus-visible {
            outline: 2px solid var(--emerald);
            outline-offset: 2px;
        }
        .app-shell {
            max-width: 1080px;
            margin: 0 auto;
            padding: 14px 16px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 4px;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--emerald-dim);
            border: 1px solid rgba(16, 185, 129, 0.45);
            color: var(--emerald);
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        .brand-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-main);
            line-height: 1.15;
        }
        .brand-sub {
            font-size: 11.5px;
            color: var(--text-muted);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background-color 0.16s ease, border-color 0.16s ease;
        }
        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
        }
        .btn.active {
            background: var(--emerald-dim);
            border-color: var(--emerald);
            color: #6ee7b7;
        }

        /* CONSOLE HI-FI DA RÁDIO NO AR */
        .tuner-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }
        .tuner-info {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 240px;
            flex: 1 1 300px;
        }
        .dial-badge {
            min-width: 68px;
            height: 68px;
            border-radius: 14px;
            background: var(--bg-base);
            border: 1px solid rgba(16, 185, 129, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 4px 8px;
        }
        .dial-freq {
            font-size: 19px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: #6ee7b7;
            line-height: 1.05;
        }
        .dial-unit {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.08em;
        }
        .tuner-meta {
            min-width: 0;
            flex: 1;
        }
        .live-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }
        .live-dot.playing {
            background: var(--emerald);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.75);
        }
        .live-status {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .live-status.playing {
            color: #6ee7b7;
        }
        .station-now-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .station-now-sub {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .eq-wave {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            opacity: 0.25;
        }
        .eq-wave.playing {
            opacity: 1;
        }
        .eq-wave span {
            width: 3px;
            height: 4px;
            background: var(--emerald);
            border-radius: 2px;
        }
        .eq-wave.playing span:nth-child(1) { animation: wave 0.7s infinite alternate; }
        .eq-wave.playing span:nth-child(2) { animation: wave 0.55s 0.15s infinite alternate; }
        .eq-wave.playing span:nth-child(3) { animation: wave 0.8s 0.25s infinite alternate; }
        @keyframes wave {
            from { height: 3px; }
            to { height: 12px; }
        }

        .tuner-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .ctrl-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            color: var(--text-main);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background-color 0.15s ease, transform 0.12s ease;
        }
        .ctrl-circle:hover {
            background: var(--bg-hover);
        }
        .ctrl-circle:active {
            transform: scale(0.94);
        }
        .ctrl-play {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--emerald);
            border: none;
            color: #04130d;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
            transition: transform 0.12s ease, opacity 0.15s ease;
        }
        .ctrl-play:hover {
            opacity: 0.92;
        }
        .ctrl-play:active {
            transform: scale(0.95);
        }
        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            padding: 7px 11px;
            border-radius: 10px;
        }
        .volume-slider {
            width: 84px;
            accent-color: var(--emerald);
            cursor: pointer;
        }

        /* BARRA DE FILTROS E BUSCA */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        .search-input {
            flex: 1 1 220px;
            min-width: 0;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--emerald);
        }
        .select-filter {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }
        .select-filter option {
            background: #11151d;
        }

        /* GRADE LIMPA DE ESTAÇÕES */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }
        .station-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }
        .station-card:hover {
            background: var(--bg-elevated);
            border-color: var(--border-strong);
        }
        .station-card.active {
            background: rgba(16, 185, 129, 0.12);
            border-color: var(--emerald);
        }
        .station-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .station-freq-pill {
            min-width: 48px;
            padding: 5px 6px;
            border-radius: 8px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            text-align: center;
            font-size: 11.5px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #93c5fd;
            flex-shrink: 0;
        }
        .station-card.active .station-freq-pill {
            border-color: rgba(16, 185, 129, 0.5);
            color: #6ee7b7;
        }
        .station-text {
            min-width: 0;
            flex: 1;
        }
        .station-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .station-card.active .station-title {
            color: #6ee7b7;
        }
        .station-sub {
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .fav-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 17px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            flex-shrink: 0;
        }
        .fav-btn.starred {
            color: var(--amber);
        }

        /* MODO SOM AMBIENTE LOJA (TRAVA TROCA ACIDENTAL NO BALCÃO) */
        body.loja-mode .toolbar,
        body.loja-mode .stations-grid,
        body.loja-mode #btnAddRadio {
            display: none !important;
        }

        /* MODAL SIMPLES PARA ADICIONAR RÁDIO PRÓPRIA */
        .modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-bg.open {
            display: flex;
        }
        .modal-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 800;
        }
        .modal-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-strong);
            color: #fff;
            border-radius: 9px;
            padding: 9px 11px;
            font-size: 13px;
        }
        .toast {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: #171d28;
            border: 1px solid rgba(16, 185, 129, 0.45);
            color: #d1fae5;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 80;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        @media (max-width: 600px) {
            .tuner-panel { padding: 14px; }
            .station-now-name { font-size: 17px; }
            .volume-box { width: 100%; justify-content: space-between; }
            .volume-slider { flex: 1; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">

            <div class="header-actions">
                <button type="button" class="btn" id="btnAddRadio" onclick="abrirModalRadio()">➕ Adicionar</button>
                <button type="button" class="btn" id="btnSleep" onclick="alternarSleep()">🌙 <span id="sleepText">Dormir</span></button>
                <button type="button" class="btn" id="btnLojaMode" onclick="alternarModoLoja()" title="Trava a tela para som ambiente em lojas">🏪 Modo Loja</button>
            </div>
        </header>

        <section class="tuner-panel" aria-label="Sintonizador principal">
            <div class="tuner-info">
                <div class="dial-badge">
                    <div class="dial-freq" id="dialFreq">90.5</div>
                    <div class="dial-unit" id="dialUnit">FM</div>
                </div>
                <div class="tuner-meta">
                    <div class="live-row">
                        <span class="live-dot" id="liveDot"></span>
                        <span class="live-status" id="liveStatus">Pronta para tocar</span>
                        <div class="eq-wave" id="eqWave"><span></span><span></span><span></span></div>
                    </div>
                    <div class="station-now-name" id="nowName">CBN São Paulo FM</div>
                    <div class="station-now-sub" id="nowSub">Jornalismo • São Paulo</div>
                </div>
            </div>

            <div class="tuner-controls">
                <button type="button" class="ctrl-circle" onclick="trocarRadio(-1)" title="Rádio anterior">◀</button>
                <button type="button" class="ctrl-play" id="btnPlayPause" onclick="alternarPlay()" title="Tocar ou Pausar">▶</button>
                <button type="button" class="ctrl-circle" onclick="trocarRadio(1)" title="Próxima rádio">▶▶</button>
                <button type="button" class="ctrl-circle" id="btnFavAtual" onclick="favoritarAtual()" title="Favoritar esta rádio">☆</button>
                <div class="volume-box">
                    <button type="button" id="btnMute" onclick="alternarMudo()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:15px;" title="Mudo">🔊</button>
                    <input type="range" id="volRange" class="volume-slider" min="0" max="100" value="85" aria-label="Volume">
                </div>
            </div>
        </section>

        <div class="toolbar">
            <input type="search" id="searchInput" class="search-input" placeholder="🔍 Buscar rádio por nome, cidade ou estilo (ex: rock, sertanejo, news)...">
            <select id="styleFilter" class="select-filter" aria-label="Filtrar por estilo">
                <option value="all">📻 Todos os Estilos</option>
                <option value="fav">⭐ Favoritas</option>
                <option value="Jornalismo">📰 Jornalismo</option>
                <option value="Pop & Hits">🎵 Pop & Hits</option>
                <option value="Rock & Flashback">🎸 Rock & Flashback</option>
                <option value="MPB & Brasil">🎷 MPB & Brasil</option>
                <option value="Sertanejo & Popular">🤠 Sertanejo & Forró</option>
                <option value="Gospel">⛪ Gospel</option>
            </select>
        </div>

        <main class="stations-grid" id="stationsGrid"></main>
    </div>

    <div id="addModal" class="modal-bg">
        <div class="modal-card">
            <div class="modal-head">
                <span>➕ Adicionar Rádio Online</span>
                <button type="button" onclick="fecharModalRadio()" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
            </div>
            <input type="text" id="customName" class="modal-input" placeholder="Nome da rádio (ex: Rádio da Cidade 98.1)">
            <input type="url" id="customUrl" class="modal-input" placeholder="Link HTTPS (.mp3, .aac ou .m3u8)">
            <select id="customStyle" class="modal-input">
                <option value="Pop & Hits">🎵 Pop & Hits</option>
                <option value="Jornalismo">📰 Jornalismo</option>
                <option value="Rock & Flashback">🎸 Rock & Flashback</option>
                <option value="Sertanejo & Popular">🤠 Sertanejo & Forró</option>
                <option value="MPB & Brasil">🎷 MPB & Brasil</option>
                <option value="Gospel">⛪ Gospel</option>
            </select>
            <button type="button" class="btn active" style="justify-content:center; padding:10px;" onclick="salvarRadioPropria()">💾 Salvar e Tocar Agora</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <audio id="audioPlayer" preload="none" crossorigin="anonymous"></audio>

            { id: 25, freq: "WEB", unit: "HLS", nome: "Rádio Forró Vagalume", cidade: "Brasil • 24h", estilo: "Sertanejo & Popular", url: "https://stream.vagalume.fm/hls/147015501223418/aac.m3u8", res: "" },
            { id: 26, freq: "97.5", unit: "FM", nome: "Melodia FM", cidade: "Rio de Janeiro, RJ", estilo: "Gospel", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/MELODIAFMAAC_SC", res: "https://playerservices.streamtheworld.com/api/livestream-redirect/MELODIAFMAAC.aac" },
            { id: 27, freq: "93.3", unit: "FM", nome: "Rádio 93 FM", cidade: "Rio de Janeiro, RJ", estilo: "Gospel", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/FM93_SC", res: "" },
            { id: 28, freq: "92.9", unit: "FM", nome: "Feliz FM", cidade: "São Paulo, SP", estilo: "Gospel", url: "https://streaming.fox.srv.br:8140/stream/1/", res: "" }
        ];

        const CHAVE_FAV = 'radiopro_favs_v1';
        const CHAVE_ULTIMA = 'radiopro_ultima_v1';
        const CHAVE_CUSTOM = 'radiopro_custom_v1';

        const audio = document.getElementById('audioPlayer');
        let hlsInst = null;
        let radios = [];
        let atualIdx = 0;
        let usandoReserva = false;
        let tocando = false;
        let favoritos = JSON.parse(localStorage.getItem(CHAVE_FAV) || '[]');
        let sleepTimer = null;
        let sleepMinutos = 0;

        function mostrarAviso(txt) {
            const el = document.getElementById('toast');
            el.textContent = txt;
            el.classList.add('show');
            clearTimeout(window._tAviso);
            window._tAviso = setTimeout(() => el.classList.remove('show'), 2200);
        }

        function carregarRadiosTotais() {
            let custom = [];
            try { custom = JSON.parse(localStorage.getItem(CHAVE_CUSTOM) || '[]'); } catch (_) {}
            radios = [...(Array.isArray(custom) ? custom : []), ...RADIOS_BASE];
            document.getElementById('totalCountLabel').textContent = radios.length;
        }

        function atualizarUIEstado(isPlaying, textoStatus) {
            tocando = isPlaying;
            document.getElementById('btnPlayPause').textContent = isPlaying ? '❚❚' : '▶';
            document.getElementById('liveDot').classList.toggle('playing', isPlaying);
            document.getElementById('eqWave').classList.toggle('playing', isPlaying);
            const st = document.getElementById('liveStatus');
            st.classList.toggle('playing', isPlaying);
            st.textContent = textoStatus || (isPlaying ? 'Ao vivo no ar' : 'Pausada');
        }

        function garantirHlsLib() {
            if (window.Hls) return Promise.resolve();
            return new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
                s.onload = res;
                s.onerror = rej;
                document.head.appendChild(s);
            });
        }

        function atualizarMediaSession(r) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: r.nome,
                    artist: `${r.estilo} • ${r.cidade}`,
                    album: 'RádioPro Brasil'
                });
                navigator.mediaSession.setActionHandler('play', () => alternarPlay());
                navigator.mediaSession.setActionHandler('pause', () => alternarPlay());
                navigator.mediaSession.setActionHandler('previoustrack', () => trocarRadio(-1));
                navigator.mediaSession.setActionHandler('nexttrack', () => trocarRadio(1));
            }
        }

        async function sintonizarRadio(idx, tentarAutoPlay = true, usarRes = false) {
            if (!radios.length) return;
            if (idx < 0) idx = radios.length - 1;
            if (idx >= radios.length) idx = 0;
            atualIdx = idx;
            usandoReserva = !!usarRes;

            const r = radios[idx];
            localStorage.setItem(CHAVE_ULTIMA, String(r.id));

            document.getElementById('dialFreq').textContent = r.freq;
            document.getElementById('dialUnit').textContent = r.unit;
            document.getElementById('nowName').textContent = r.nome;
            document.getElementById('nowSub').textContent = `${r.estilo} • ${r.cidade}`;
            const favEl = document.getElementById('btnFavAtual');
            const ehFav = favoritos.includes(r.id);
            favEl.textContent = ehFav ? '★' : '☆';
            favEl.style.color = ehFav ? 'var(--amber)' : '';

            renderizarLista();
            atualizarMediaSession(r);

            if (hlsInst) { hlsInst.destroy(); hlsInst = null; }
            audio.pause();
            audio.removeAttribute('src');
            audio.load();

            const urlAlvo = (usandoReserva && r.res) ? r.res : r.url;
            if (!tentarAutoPlay) {
                atualizarUIEstado(false, 'Toque ▶ para ouvir');
                return;
            }

            atualizarUIEstado(false, 'Conectando...');
            if (urlAlvo.includes('.m3u8')) {
                try {
                    await garantirHlsLib();
                    if (window.Hls && Hls.isSupported()) {
                        hlsInst = new Hls({ enableWorker: true });
                        hlsInst.loadSource(urlAlvo);
                        hlsInst.attachMedia(audio);
                        hlsInst.on(Hls.Events.MANIFEST_PARSED, () => {
                            audio.play().then(() => atualizarUIEstado(true)).catch(() => atualizarUIEstado(false, 'Toque ▶ para iniciar'));
                        });
                        hlsInst.on(Hls.Events.ERROR, (_, d) => {
                            if (d.fatal) tratarErroRadio(r);
                        });
                        return;
                    }
                } catch (_) {}
            }

            audio.src = urlAlvo;
            audio.play()
                .then(() => atualizarUIEstado(true))
                .catch(() => atualizarUIEstado(false, 'Toque ▶ para ouvir'));
        }

        function tratarErroRadio(r) {
            if (!usandoReserva && r.res) {
                mostrarAviso(`🔁 Ativando sinal reserva de ${r.nome}...`);
                sintonizarRadio(atualIdx, true, true);
                return;
            }
            mostrarAviso(`⚠️ ${r.nome} oscilou agora. Pulando...`);
            trocarRadio(1);
        }

        audio.addEventListener('playing', () => atualizarUIEstado(true));
        audio.addEventListener('pause', () => {
            if (!audio.ended) atualizarUIEstado(false, 'Pausada');
        });
        audio.addEventListener('error', () => {
            if (audio.getAttribute('src') && tocando) tratarErroRadio(radios[atualIdx]);
        });

        function alternarPlay() {
            const r = radios[atualIdx];
            if (!r) return;
            if (!audio.getAttribute('src') && !hlsInst) {
                sintonizarRadio(atualIdx, true, false);
                return;
            }
            if (audio.paused) {
                audio.play().then(() => atualizarUIEstado(true)).catch(() => sintonizarRadio(atualIdx, true, false));
            } else {
                audio.pause();
                atualizarUIEstado(false, 'Pausada');
            }
        }

        function trocarRadio(dir) {
            sintonizarRadio(atualIdx + dir, true, false);
        }

        function favoritarId(id, ev) {
            if (ev) ev.stopPropagation();
            const pos = favoritos.indexOf(id);
            if (pos >= 0) {
                favoritos.splice(pos, 1);
                mostrarAviso('Removida das favoritas');
            } else {
                favoritos.push(id);
                mostrarAviso('⭐ Salva nas favoritas');
            }
            localStorage.setItem(CHAVE_FAV, JSON.stringify(favoritos));
            if (radios[atualIdx] && radios[atualIdx].id === id) {
                const favEl = document.getElementById('btnFavAtual');
                favEl.textContent = favoritos.includes(id) ? '★' : '☆';
                favEl.style.color = favoritos.includes(id) ? 'var(--amber)' : '';
            }
            renderizarLista();
        }
        function favoritarAtual() {
            if (radios[atualIdx]) favoritarId(radios[atualIdx].id);
        }

        function alternarMudo() {
            audio.muted = !audio.muted;
            document.getElementById('btnMute').textContent = audio.muted ? '🔇' : '🔊';
        }
        document.getElementById('volRange').addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
            if (audio.muted && audio.volume > 0) alternarMudo();
        });
        audio.volume = 0.85;

        function alternarSleep() {
            clearTimeout(sleepTimer);
            const opcoes = [0, 15, 30, 60];
            sleepMinutos = opcoes[(opcoes.indexOf(sleepMinutos) + 1) % opcoes.length];
            const btn = document.getElementById('btnSleep');
            const lbl = document.getElementById('sleepText');
            if (sleepMinutos === 0) {
                btn.classList.remove('active');
                lbl.textContent = 'Dormir';
                mostrarAviso('Timer desligado');
            } else {
                btn.classList.add('active');
                lbl.textContent = `${sleepMinutos}m`;
                mostrarAviso(`🌙 Desliga sozinha em ${sleepMinutos} min`);
                sleepTimer = setTimeout(() => {
                    audio.pause();
                    atualizarUIEstado(false, 'Desligada pelo timer');
                    sleepMinutos = 0;
                    btn.classList.remove('active');
                    lbl.textContent = 'Dormir';
                }, sleepMinutos * 60000);
            }
        }

        function alternarModoLoja() {
            const on = document.body.classList.toggle('loja-mode');
            const btn = document.getElementById('btnLojaMode');
            btn.classList.toggle('active', on);
            btn.textContent = on ? '🔓 Destravar' : '🏪 Modo Loja';
            mostrarAviso(on ? '🏪 Tela travada para som ambiente da loja' : 'Lista liberada');
        }

        function abrirModalRadio() { document.getElementById('addModal').classList.add('open'); }
        function fecharModalRadio() { document.getElementById('addModal').classList.remove('open'); }
        function salvarRadioPropria() {
            const nome = document.getElementById('customName').value.trim();
            const url = document.getElementById('customUrl').value.trim();
            const estilo = document.getElementById('customStyle').value;
            if (!nome || !url.startsWith('https://')) {
                mostrarAviso('⚠️ Informe o nome e link HTTPS válido');
                return;
            }
            let custom = [];
            try { custom = JSON.parse(localStorage.getItem(CHAVE_CUSTOM) || '[]'); } catch (_) {}
            custom.unshift({ id: Date.now(), freq: 'WEB', unit: 'PRO', nome, cidade: 'Minha Rádio', estilo, url, res: '' });
            localStorage.setItem(CHAVE_CUSTOM, JSON.stringify(custom));
            carregarRadiosTotais();
            fecharModalRadio();
            document.getElementById('customName').value = '';
            document.getElementById('customUrl').value = '';
            sintonizarRadio(0, true, false);
            mostrarAviso('✅ Rádio salva e tocando!');
        }

        function renderizarLista() {
            const grid = document.getElementById('stationsGrid');
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            const est = document.getElementById('styleFilter').value;

            const filtradas = radios
                .map((r, i) => ({ r, i }))
                .filter(({ r }) => {
                    if (est === 'fav' && !favoritos.includes(r.id)) return false;
                    if (est !== 'all' && est !== 'fav' && r.estilo !== est) return false;
                    if (q && !`${r.nome} ${r.cidade} ${r.estilo} ${r.freq}`.toLowerCase().includes(q)) return false;
                    return true;
                });

            if (!filtradas.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-muted);">Nenhuma rádio encontrada para este filtro.</div>';
                return;
            }

            grid.innerHTML = filtradas.map(({ r, i }) => {
                const isFav = favoritos.includes(r.id);
                const isAct = i === atualIdx;
                return `
                    <div class="station-card ${isAct ? 'active' : ''}" onclick="sintonizarRadio(${i}, true, false)">
                        <div class="station-left">
                            <div class="station-freq-pill">${r.freq}</div>
                            <div class="station-text">
                                <div class="station-title">${r.nome}</div>
                                <div class="station-sub">${r.estilo} • ${r.cidade}</div>
                            </div>
                        </div>
                        <button type="button" class="fav-btn ${isFav ? 'starred' : ''}" onclick="favoritarId(${r.id}, event)" title="Favoritar">${isFav ? '★' : '☆'}</button>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('searchInput').addEventListener('input', renderizarLista);
        document.getElementById('styleFilter').addEventListener('change', renderizarLista);

        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        carregarRadiosTotais();
        const params = new URLSearchParams(window.location.search);
        if (params.get('loja') === '1') alternarModoLoja();
        const ultimaId = parseInt(localStorage.getItem(CHAVE_ULTIMA) || '', 10);
        const startIdx = Number.isFinite(ultimaId) ? Math.max(0, radios.findIndex(r => r.id === ultimaId)) : 0;
        sintonizarRadio(startIdx, false, false);

        // Telemetria leve: registra IP, rádio atual, tempo conectado e chave de acesso
        (function iniciarTelemetriaRadio() {

            try {
                if (chave) localStorage.setItem('radiopro_chave_cliente', chave);
                else chave = (localStorage.getItem('radiopro_chave_cliente') || '').trim().toUpperCase();
            } catch (_) {}

            let sessaoId = '';
            try {
                sessaoId = sessionStorage.getItem('radiopro_sessao_id') || '';

                    app: 'radiopro',
                    item_atual: radioAtual,

                        document.body.appendChild(aviso);
                    } else if (data.aviso_pre && !bloqueioExibido) {
                        let banner = document.getElementById('bannerPreExpiracao');
                        const sRest = Number(data.aviso_pre.restante_seg || 0);
                        const min = Math.max(1, Math.ceil(sRest / 60));
                        const tempoTxt = min > 60 ? (Math.floor(min / 60) + 'h ' + (min % 60) + 'min') : (min + ' min');
                        if (!banner) {
                            banner = document.createElement('div');
                            banner.id = 'bannerPreExpiracao';

                            document.body.appendChild(banner);
                        }
                        banner.innerHTML = '<span>⚠️ Teste acaba em <strong>' + tempoTxt + '</strong>!</span>'
                            + '<a href="https://wa.me/5511966707293?text=' + encodeURIComponent('Olá Jonas! Meu teste termina em ' + tempoTxt + ' e quero garantir meu acesso.') + '" target="_blank" style="background:#0c0e12;color:#34d399;font-weight:800;padding:6px 14px;border-radius:99px;text-decoration:none;font-size:12px;">💬 Chamar no WhatsApp ↗</a>'
                            + '<button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;font-size:15px;color:#0f131a;padding:0 4px;font-weight:bold;" title="Dispensar aviso">✕</button>';
                    }
                })
                .catch(() => {});
            }

            setTimeout(enviarPing, 2000);
            setInterval(enviarPing, 45000);
            window.addEventListener('pagehide', () => {
                if (navigator.sendBeacon && window.location.protocol !== 'file:') {
                    navigator.sendBeacon(URL_PING, montarPayload());
                }
            });
        })();
    </script>
